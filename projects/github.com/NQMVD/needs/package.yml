distributable:
  url: https://github.com/NQMVD/needs/archive/refs/tags/{{ version.tag }}.tar.gz
  strip-components: 1

provides:
  - bin/needs

versions:
  github: NQMVD/needs

build:
  dependencies:
    rust-lang.org: '>=1.56'
    rust-lang.org/cargo: '*'
  script: cargo install --locked --path . --root {{prefix}}

test:
  - needs --version | grep '{{version}}'